<!DOCTYPE html>
<html lang="en">
<head>
  <!-- SOSOCO App - Running on AWS -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOSOCO App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      background-color: #0f1117;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      margin-bottom: 20px;
      color: #f0a500;
    }
    img {
      width: 100%;
      max-width: 1200px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    p {
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: #aaaaaa;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <h1>SOSOCO App - Running on AWS</h1>
  <img src="https://cdn.hashnode.com/res/hashnode/image/upload/v1679325411967/805c4b2e-6c8c-4a18-a190-2bd23e93c8d6.jpeg" alt="AWS Architecture">

</html>
