name: Deploy Image to Docker Hub

# 1. Triggers: Run when code is pushed to the version3 branch
on:
  push:
    branches:
      - version3

jobs:
  release:
    # Specifies the virtual machine environment
    runs-on: ubuntu-latest

    steps:
      # 2. Extract repository code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 3. Initialize Docker Buildx for advanced caching/multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Authenticate to the container registry using repository secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.SOSOCO_DOCKERHUB_USERNAME }}
          password: ${{ secrets.SOSOCO_DOCKERHUB_TOKEN }}

      # 5. Compile the container image and upload it to the registry
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: xwsvelle/sosoco-app:latest
